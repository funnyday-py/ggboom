name: VPN Gate Node Check

on:
  # 定时检测: 默认每 30 分钟一次。改成每 60 分钟: cron: "0 * * * *"
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: gate-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Get VPN Gate nodes + check via Cloudflare Worker + build page
        run: python vpngate.py
        env:
          # 已部署的检测 Worker (实测可用; 原自定义域 check.helei.kdns.fr DNS 已失效)
          CHECK_WORKER: "https://green-rice-2c18.zxm378t0.workers.dev/check?sstp=vpn:vpn@"
          CHECK_CONCURRENCY: "32"
          CHECK_TIMEOUT: "90"
          # 本仓库 Pages 固定地址 (生成文件里的注释引用)
          CHAIN_URL: "https://funnyday-py.github.io/ggboom/chains.txt"
          HOSTS_URL: "https://funnyday-py.github.io/ggboom/hosts.txt"
          SUB_URL: "https://funnyday-py.github.io/ggboom/sub.txt"
          # Worker 自定义域 (edgetunnel 部署在 edt-gate)
          EDT_DOMAIN: "vpn.cnzxmdd.cc.cd"
          # 优选入口池构成 (脚本内部按本机实测排序):
          #   1) 本机实测验证域名 (www.speedtest.net 9.57Mbps 断层第一 / postman / ox.ac.uk)
          #   2) 外部优选域名源 (LancelotRar/best-cf-domains, 只作冗余)
          #   3) 优选 IP 源 (LancelotRar/best-cf-ips 优先, ludas114343 兜底)
          #      IP 源全部走 CF 官方网段白名单校验, 拉取失败回退内置列表
          #   实测: 域名型入口跨轮极差 <1.5Mbps, IP 型入口极差可达 6.18Mbps, 故域名优先
          SUB_ENTRY: "www.speedtest.net:443,www.postman.com:443,www.ox.ac.uk:443,vpn.cnzxmdd.cc.cd:443"
          EDGE_HOSTS: "www.speedtest.net:443,www.postman.com:443,www.ox.ac.uk:443"
          CF_IP_LIMIT: "6"
          CF_DOMAIN_LIMIT: "2"

      - name: Ensure GitHub Pages is enabled (one-time auto setup)
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pages")
          echo "Pages API status: $code"
          if [ "$code" = "404" ]; then
            echo "首次运行: 启用 GitHub Pages (source = GitHub Actions, 目录 /public)"
            curl -sS -X PUT \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Content-Type: application/json" \
              -d '{"build_type":"workflow","source":{"branches":["main"],"path":"/public"}}' \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/pages"
            echo
            sleep 10
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Show site URL
        run: 'echo "site: https://funnyday-py.github.io/ggboom/ (deploy outcome: ${{ steps.deployment.outcome }})"'
