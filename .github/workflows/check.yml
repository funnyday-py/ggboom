name: VPN Gate Node Check

on:
  # 定时检测: 配置每 6 小时一次, 但 GitHub 对免费仓库的 schedule 仍会降频。
  # 实测改成 6h 后间隔为 7~9 小时 (11-07 两次 7.19h / 8.94h, 00:00、06:00 UTC
  # 应跑时点没有 run)。配置写 6h 只为让意图明确, 实际频率以历史 run 时间戳为准。
  # 需要立刻刷新时, 在本机跑 `python trigger_build.py --with-probe`
  # (全量探测入口 -> 推健康数据 -> 立即构建); 只想构建可加 --force。
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: gate-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Get VPN Gate nodes + check via Cloudflare Worker + build page
        run: python vpngate.py
        env:
          # 已部署的检测 Worker (实测可用; 原自定义域 check.helei.kdns.fr DNS 已失效)
          CHECK_WORKER: "https://green-rice-2c18.zxm378t0.workers.dev/check?sstp=vpn:vpn@"
          CHECK_CONCURRENCY: "32"
          CHECK_TIMEOUT: "90"
          # 本仓库 Pages 固定地址 (生成文件里的注释引用)
          CHAIN_URL: "https://funnyday-py.github.io/ggboom/chains.txt"
          HOSTS_URL: "https://funnyday-py.github.io/ggboom/hosts.txt"
          SUB_URL: "https://funnyday-py.github.io/ggboom/sub.txt"
          # Worker 自定义域 (edgetunnel 部署在 edt-gate)
          EDT_DOMAIN: "vpn.cnzxmdd.cc.cd"
          # 优选入口池构成 (脚本内部按本机实测排序):
          #   1) SUB_ENTRY 预设 (主力域名 + 自有域兜底)
          #   2) 本机实测域名 VERIFIED_DOMAINS (CloudflareSpeedTest + 端到端验证)
          #   3) 本机实测优选 IP VERIFIED_IPS (SJC/LAX 段) <- 池子主力
          #   4) 外部源兜底 (域名 1 个 + IP 2 个; 实测外部 IP 5/6 超时, 只垫底)
          #      IP 源全部走 CF 官方网段白名单校验, 拉取失败回退内置列表
          # 实测: 域名型入口跨轮极差 <2.6Mbps, IP 型入口极差可达 6.18Mbps, 故域名优先
          # 注意: CFST 的下载速度排名对本场景无预测力(r=0.424), 只有端到端实测过的才能进池
          #
          # 下发前剔除死入口: vpngate.py 读仓库根目录的 entry_health.json。
          # 该文件由用户在本机跑 `python probe_entries.py --push` 生成并提交。
          # 故意不在 CI 里直接探测 —— runner 在美国机房, 到 CF 边缘必然全绿,
          # 而真正决定可用性的是「本机 -> CF 边缘」。结论超 24h 只是提示刷新,
          # 仍沿用最后一次实测; 超过硬上限则只保留判死项, 不会把死入口放回订阅。
          # 订阅直出分两组: 「非CF站」纯直出少一跳 / 「CF站」经 ProxyIP 中转绕回环保护。
          SUB_ENTRY: "www.speedtest.net:443,vpn.cnzxmdd.cc.cd:443"
          EDGE_HOSTS: "www.speedtest.net:443,www.postman.com:443,www.ox.ac.uk:443"
          CF_IP_LIMIT: "2"
          CF_DOMAIN_LIMIT: "1"
          # 第三方反代试验组: 默认关闭。以后想开, 在仓库
          # 「设置 → Secrets and variables → Actions → Variables」加一条
          # THIRD_PARTY_ENABLED = 1 即可, 不用改代码、不用重新推送;
          # 改回 0 或删掉变量就关闭。THIRD_PARTY_LIMIT 控制下发条数 (默认 6)。
          # 注意: 该组 IP 属第三方 VPS, 对方可见 SNI 与流量元数据, 启用前请知情。
          THIRD_PARTY_ENABLED: ${{ vars.THIRD_PARTY_ENABLED || '0' }}
          THIRD_PARTY_LIMIT: ${{ vars.THIRD_PARTY_LIMIT || '6' }}

      - name: Ensure GitHub Pages is enabled (one-time auto setup)
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pages")
          echo "Pages API status: $code"
          if [ "$code" = "404" ]; then
            echo "首次运行: 启用 GitHub Pages (source = GitHub Actions, 目录 /public)"
            curl -sS -X PUT \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Content-Type: application/json" \
              -d '{"build_type":"workflow","source":{"branches":["main"],"path":"/public"}}' \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/pages"
            echo
            sleep 10
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # 同步 ADD.txt 到 Cloudflare KV (edgetunnel「自适应订阅」的数据源)。
      # 此前靠手动在 /admin 后台粘贴, 现改为每次 workflow 跑完自动推送。
      # 需要的 Secrets:
      #   CF_API_TOKEN       - 权限: Account > Workers KV Storage > Edit
      #   CF_KV_NAMESPACE_ID - KV 命名空间 VPN20261021 的 id (dashboard > Workers & Pages > KV)
      - name: Sync ADD.txt to Cloudflare KV
        run: |
          code=$(curl -s -o /tmp/kv_resp.json -w '%{http_code}' -X PUT \
            -H "Authorization: Bearer $CF_API_TOKEN" \
            -H "Content-Type: text/plain;charset=UTF-8" \
            --data-binary @ADD.txt \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/storage/kv/namespaces/$CF_KV_NAMESPACE_ID/values/ADD.txt")
          echo "KV PUT status: $code"
          cat /tmp/kv_resp.json; echo
          [ "$code" = "200" ] || exit 1
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_KV_NAMESPACE_ID: ${{ secrets.CF_KV_NAMESPACE_ID }}
          # account id 非敏感, 明文即可
          CF_ACCOUNT_ID: "8cc8a4b67c1bfc6a9ddb6e3b1e61300b"

      - name: Show site URL
        run: 'echo "site: https://funnyday-py.github.io/ggboom/ (deploy outcome: ${{ steps.deployment.outcome }})"'
